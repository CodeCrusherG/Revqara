# Alembic configuration for CampaignX.
# The database URL is injected at runtime from environment variables in
# db/migrations/env.py (it overrides sqlalchemy.url), so it is intentionally
# left blank here.
[alembic]
script_location = db/migrations
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]

# ── Logging ───────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
