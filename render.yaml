services:
  - type: web
    name: campaignx-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        sync: false
      - key: WA_SIM_URL
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: web
    name: whatsapp-sim
    env: python
    buildCommand: "pip install -r whatsapp-sim/requirements.txt"
    startCommand: "cd whatsapp-sim && uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: WA_WEBHOOK_URL
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
